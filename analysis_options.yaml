# Strict, but tuned for an 8-hour build.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "build/**"
    - android/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    todo: ignore

linter:
  rules:
    public_member_api_docs: false      # no dartdoc on every public member (hackathon)
    lines_longer_than_80_chars: false  # dart format handles layout; avoid churn
    sort_pub_dependencies: false
