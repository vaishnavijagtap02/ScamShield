name: scamshield
description: "ScamShield - Fraud detection and digital arrest safety app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  http: ^1.6.0
  record: ^7.1.2
  file_picker: ^13.3.2
  shared_preferences: ^2.5.6
  flutter_tts: ^4.2.5
  wakelock_plus: ^1.8.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  assets:
    - assets/action_plan.json
    - assets/demo/

  fonts:
    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mukta-Bold.ttf
          weight: 700
        - asset: assets/fonts/Mukta-ExtraBold.ttf
          weight: 800
